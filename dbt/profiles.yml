fsc_lake:
  target: dev
  outputs:
    dev:
      type: duckdb
      # scratch anchor DB; all models materialize into the attached DuckLake `lake`
      path: /home/ubuntu/dagster/dbt/dbt.duckdb
      # DuckLake's SQLite catalog is single-writer; concurrent model commits
      # conflict ("Failed to commit DuckLake transaction"), so serialize.
      threads: 1
      extensions:
        - sqlite
        - ducklake
      attach:
        # DuckLake catalog (SQLite metadata backend); data_path is read from metadata
        - path: "ducklake:sqlite:/home/ubuntu/dagster/lake_catalog.duckdb"
          alias: lake
